name: Weekly API Diff

on:
  schedule:
    - cron: '0 17 * * 1' # Monday 9am PST / 10am PDT (GH Actions cron is UTC)
  workflow_dispatch: # manual trigger for testing

jobs:
  weekly-api-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SNAPSHOTS_REPO: LFDanLu/react-spectrum-api-snapshots

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required to (a) resolve the last release tag's commit
          # for the baseline, (b) let `get-ref-api` `git archive` that commit, and
          # (c) find the last `Publish` commit for the delta bookkeeping below.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - run: yarn --immutable

      # Build the tsdiff binary (the current extractor + differ). ubuntu
      # runners ship a Rust toolchain, so no separate setup step is needed.
      - name: Build tsdiff
        run: cd packages/dev/tsdiff && cargo build --release

      # Build current main API (~2 min, always fresh): build the checkout in
      # place, then extract its type API into dist/branch-api.
      - name: Build current API snapshot
        run: |
          yarn build
          packages/dev/tsdiff/target/release/tsdiff get-local-api --repo-root . --output dist/branch-api

      # Build the release baseline from the last minor/major release commit
      # (skips patch-only releases). get-ref-api snapshots that commit with
      # `git archive`, builds it in a temp dir, and extracts into dist/base-api.
      - name: Build release baseline
        run: |
          BASELINE_REF=$(git rev-list -n 1 $(git tag -l 'react-aria-components@*' | grep -E '@[0-9]+\.[0-9]+\.0$' | sort -V | tail -1))
          echo "Baseline ref (last react-aria-components minor/major release): $BASELINE_REF"
          packages/dev/tsdiff/target/release/tsdiff get-ref-api --repo-root . --ref "$BASELINE_REF" --output dist/base-api

      - name: Generate diff
        run: |
          packages/dev/tsdiff/target/release/tsdiff compare \
            --base-api-dir dist/base-api \
            --branch-api-dir dist/branch-api \
            --ci > /tmp/diff-current.md || true

      # Check out snapshots repo so we can read the previous diff and commit the new one
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SNAPSHOTS_REPO }}
          path: snapshots
          token: ${{ secrets.SNAPSHOTS_REPO_TOKEN }}

      # Compute week-to-week delta and commit new diff
      - name: Save diff and compute delta
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "TODAY=$TODAY" >> $GITHUB_ENV

          CURRENT_PUBLISH=$(git log --grep='^Publish$' --oneline -1 | awk '{print $1}')
          PREV_PUBLISH=$(cat snapshots/last-publish-hash.txt 2>/dev/null || echo "")

          echo "=== Release detection ==="
          echo "CURRENT_PUBLISH=$CURRENT_PUBLISH"
          echo "PREV_PUBLISH=$PREV_PUBLISH"

          if [ -n "$PREV_PUBLISH" ] && [ "$CURRENT_PUBLISH" != "$PREV_PUBLISH" ]; then
            # Detect minor/major vs patch: check if s2 or react-aria-components got a x.y.0 tag on this Publish commit
            IS_MINOR=$(git tag --points-at "$CURRENT_PUBLISH" | grep -E '^(@react-spectrum/s2|react-aria-components)@[0-9]+\.[0-9]+\.0$' | head -1)
            echo "IS_MINOR_OR_MAJOR=${IS_MINOR:-(none)}"
            if [ -n "$IS_MINOR" ]; then
              echo "Minor/major release detected, resetting baseline"
              echo "NEW_RELEASE=true" >> $GITHUB_ENV
            else
              echo "Patch release detected, updating hash, continuing with delta"
              echo "$CURRENT_PUBLISH" > snapshots/last-publish-hash.txt
            fi
          else
            echo "No new release"
          fi

          NEW_RELEASE="${NEW_RELEASE:-false}"

          # Week-over-week delta: the ts diff from last week's main commit to the
          # current main, computed directly with the new tool (both sides are
          # Rust-extracted). We record main's HEAD in the snapshots repo so we
          # know where "last week" was. The first run just seeds that hash (no
          # delta); every run after produces a clean commit-to-commit diff. This
          # replaces diffing against the (old Node-format) diff text in storage.
          CURRENT_MAIN=$(git rev-parse HEAD)
          PREV_MAIN=$(cat snapshots/last-main-hash.txt 2>/dev/null || echo "")

          if [ "$NEW_RELEASE" != "true" ]; then
            echo ""
            echo "=== Delta computation (ts diff: last week's main -> current main) ==="
            echo "PREV_MAIN=${PREV_MAIN:-(none)}"
            echo "CURRENT_MAIN=$CURRENT_MAIN"
            if [ -z "$PREV_MAIN" ]; then
              echo "(no stored main hash yet — seeding it this run, no delta)" > /tmp/weekly-delta.txt
            elif [ "$PREV_MAIN" = "$CURRENT_MAIN" ]; then
              : > /tmp/weekly-delta.txt   # main unchanged since last run
            else
              packages/dev/tsdiff/target/release/tsdiff get-ref-api --repo-root . --ref "$PREV_MAIN" --output dist/last-week-api
              packages/dev/tsdiff/target/release/tsdiff compare \
                --base-api-dir dist/last-week-api \
                --branch-api-dir dist/branch-api \
                --ci > /tmp/weekly-delta.txt || true
            fi
          fi

          echo ""
          echo "=== File sizes ==="
          echo "diff-current.md: $(wc -c < /tmp/diff-current.md) bytes"
          ls /tmp/weekly-delta.txt 2>/dev/null && echo "weekly-delta.txt: $(wc -c < /tmp/weekly-delta.txt) bytes" || echo "weekly-delta.txt: not created"
          echo ""
          echo "=== Delta content (first 20 lines) ==="
          head -20 /tmp/weekly-delta.txt 2>/dev/null || echo "(none)"

          # Commit a diff if there is a new minor/major release (fresh baseline), or diff changed from last week
          # Skip if no difference from last diff (aka no change from last week/last run), or if the diff against the release code is empty
          echo ""
          echo "=== Commit decision ==="
          if [ -s /tmp/diff-current.md ] && ([ "$NEW_RELEASE" = "true" ] || [ -s /tmp/weekly-delta.txt ]); then
            echo "Committing diff to snapshots repo"
            cp /tmp/diff-current.md snapshots/diffs/$TODAY.md
            mkdir -p snapshots/deltas
            # The delta is now the ts diff (last week's main -> current main),
            # which is already "what changed on main this week" — store it as-is.
            if [ -s /tmp/weekly-delta.txt ]; then
              cp /tmp/weekly-delta.txt snapshots/deltas/$TODAY.md
            fi
            cd snapshots
            git config user.email "github-actions@github.com"
            git config user.name "GitHub Actions"
            git add diffs/$TODAY.md
            [ -f deltas/$TODAY.md ] && git add deltas/$TODAY.md
            echo "$CURRENT_PUBLISH" > last-publish-hash.txt
            git add last-publish-hash.txt
            # Record main's HEAD so next week's delta can diff from here.
            echo "$CURRENT_MAIN" > last-main-hash.txt
            git add last-main-hash.txt
            echo "=== Staged changes ==="
            git diff --cached --stat
            git diff --cached --quiet || (git commit -m "weekly api diff $TODAY" && git push)
          else
            echo "Skipping commit — diff-current empty=$([ ! -s /tmp/diff-current.md ] && echo yes || echo no), new_release=$NEW_RELEASE, delta_empty=$([ ! -s /tmp/weekly-delta.txt ] && echo yes || echo no)"
          fi
