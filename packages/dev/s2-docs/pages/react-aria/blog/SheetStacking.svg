<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 0 646 460">
<g style="--fg: light-dark(#24292f, #e6edf3); --muted: light-dark(#57606a, #9198a1); --line: light-dark(#8c959f, #6e7681); --hatch-bg: light-dark(#f6f8fa, #161b22); --hatch-line: light-dark(#d0d7de, #30363d); --surface: light-dark(#ffffff, #21262d); --grabber: light-dark(#afb8c1, #6e7681); --stage: light-dark(#0969da, #4493f8); --stage-bg: light-dark(#ddf4ff, #0d2a4d); --viewport: light-dark(#bf5700, #f0883e); --marker: light-dark(#8250df, #ab7df8); --sans: var(--anatomy-font, system-ui), system-ui, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; font-family: var(--sans)" fill="var(--fg)" font-size="13">
  <defs>
    <pattern id="sheet-stacking-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="var(--hatch-bg)"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--hatch-line)" stroke-width="2"/>
    </pattern>
    <filter id="sheet-stacking-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
    <marker id="sheet-stacking-a-muted" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
    <marker id="sheet-stacking-a-mk" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--marker)"/></marker>
    <marker id="sheet-stacking-a-stage" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--stage)"/></marker>
  </defs>
<rect x="40" y="30" width="220" height="400" rx="8" fill="var(--hatch-bg)"/>
<text x="48" y="50" fill="var(--viewport)" font-weight="600">window</text>
<path d="M72,80 q0,-10 10,-10 h136 q10,0 10,10 v350 h-156 z" fill="var(--surface)" stroke="var(--fg)" filter="url(#sheet-stacking-shadow)"/><rect x="132.0" y="76" width="36" height="5" rx="2.5" fill="var(--grabber)"/><circle cx="92" cy="98" r="10" fill="var(--muted)"/><text x="92" y="102" text-anchor="middle" font-weight="600" font-size="12" fill="var(--surface)">0</text><text x="110" y="102" font-weight="600" font-size="12">Sheet 0</text>
<path d="M60,130 q0,-10 10,-10 h160 q10,0 10,10 v300 h-180 z" fill="var(--surface)" stroke="var(--marker)" filter="url(#sheet-stacking-shadow)"/><rect x="132.0" y="126" width="36" height="5" rx="2.5" fill="var(--grabber)"/><circle cx="80" cy="148" r="10" fill="var(--marker)"/><text x="80" y="152" text-anchor="middle" font-weight="600" font-size="12" fill="var(--surface)">1</text><text x="98" y="152" font-weight="600" font-size="12">Sheet 1</text>
<path d="M48,180 q0,-10 10,-10 h184 q10,0 10,10 v250 h-204 z" fill="var(--surface)" stroke="var(--stage)" filter="url(#sheet-stacking-shadow)"/><rect x="132.0" y="176" width="36" height="5" rx="2.5" fill="var(--grabber)"/><circle cx="68" cy="198" r="10" fill="var(--stage)"/><text x="68" y="202" text-anchor="middle" font-weight="600" font-size="12" fill="var(--surface)">2</text><text x="86" y="202" font-weight="600" font-size="12">Sheet 2</text>
<rect x="40" y="30" width="220" height="400" rx="8" fill="none" stroke="var(--viewport)" stroke-width="2.5"/>
<text x="340" y="50" font-weight="600">html</text><text x="358" y="70" style="font-family: var(--mono)" font-size="12">timeline-scope: --sheet-timeline-0,</text><text x="380" y="87" style="font-family: var(--mono)" font-size="12"><tspan fill="var(--marker)">--sheet-timeline-1</tspan>, <tspan fill="var(--stage)">--sheet-timeline-2</tspan>;</text>
<circle cx="340" cy="121" r="10" fill="var(--muted)"/><text x="340" y="125" text-anchor="middle" font-weight="600" font-size="12" fill="var(--surface)">0</text><text x="358" y="125" font-weight="600">Sheet 0 (depth 2)</text><text x="358" y="145" style="font-family: var(--mono)" font-size="12">view-timeline: --sheet-timeline-0;</text><text x="358" y="162" style="font-family: var(--mono)" font-size="12">animation-name: stack, stack;</text><text x="358" y="179" style="font-family: var(--mono)" font-size="12">animation-timeline: <tspan fill="var(--marker)">--sheet-timeline-1</tspan>,</text><text x="380" y="196" style="font-family: var(--mono)" font-size="12"><tspan fill="var(--stage)">--sheet-timeline-2</tspan>;</text><text x="358" y="213" style="font-family: var(--mono)" font-size="12">animation-composition: accumulate;</text>
<circle cx="340" cy="246" r="10" fill="var(--marker)"/><text x="340" y="250" text-anchor="middle" font-weight="600" font-size="12" fill="var(--surface)">1</text><text x="358" y="250" font-weight="600">Sheet 1 (depth 1)</text><text x="358" y="270" style="font-family: var(--mono)" font-size="12">view-timeline: <tspan fill="var(--marker)">--sheet-timeline-1</tspan>;</text><text x="358" y="287" style="font-family: var(--mono)" font-size="12">animation-name: stack;</text><text x="358" y="304" style="font-family: var(--mono)" font-size="12">animation-timeline: <tspan fill="var(--stage)">--sheet-timeline-2</tspan>;</text>
<circle cx="340" cy="341" r="10" fill="var(--stage)"/><text x="340" y="345" text-anchor="middle" font-weight="600" font-size="12" fill="var(--surface)">2</text><text x="358" y="345" font-weight="600">Sheet 2 (front)</text><text x="358" y="365" style="font-family: var(--mono)" font-size="12">view-timeline: <tspan fill="var(--stage)">--sheet-timeline-2</tspan>;</text><text x="358" y="382" style="font-family: var(--mono)" font-size="12"><tspan fill="var(--muted)">/* no sheets in front */</tspan></text>
</g>
</svg>
