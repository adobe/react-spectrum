<text x="665.0" y="555" font-size="15" font-weight="600" text-anchor="middle">Open</text>
<text x="665.0" y="575" style="font-family: var(--mono)" font-size="12" fill="var(--muted)" text-anchor="middle">scrollTop = max</text>
<line x1="365" y1="190" x2="525" y2="190" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#sheet-viewport-a-muted)"/>
<text x="445.0" y="178" fill="var(--muted)" font-size="12" text-anchor="middle">open: smooth scroll</text>
<text x="445.0" y="210" fill="var(--muted)" font-size="12" text-anchor="middle">sheet slides up</text>
<line x1="525" y1="320" x2="365" y2="320" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#sheet-viewport-a-muted)"/>
<text x="445.0" y="308" fill="var(--muted)" font-size="12" text-anchor="middle">swipe down: scroll to 0</text>
