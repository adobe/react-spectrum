<text x="665.0" y="88.0" font-weight="600" text-anchor="middle">exit snap point</text><text x="665.0" y="106.0" style="font-family: var(--mono)" font-size="12" fill="var(--muted)" text-anchor="middle">scroll-snap-align: start</text><text x="665.0" y="328.0" font-weight="600" text-anchor="middle">exit snap point</text><text x="665.0" y="346.0" style="font-family: var(--mono)" font-size="12" fill="var(--muted)" text-anchor="middle">scroll-snap-align: end</text>
